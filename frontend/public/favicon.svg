<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="8" />

  <!-- Graduation Mortarboard Cap Layer -->
  <!-- Top Diamond -->
  <polygon points="256,120 420,190 256,260 92,190" fill="#ffffff" />
  
  <!-- Cap Underside Detail -->
  <polygon points="256,260 420,190 256,210 92,190" fill="url(#accentGrad)" opacity="0.4" />

  <!-- Cap Skull Base / Cap Band -->
  <path d="M148 224 V275 C148 315 200 345 256 345 C312 345 364 315 364 275 V224 L256 270 Z" fill="#f8fafc" />

  <!-- Tassel Ribbon & Bead -->
  <path d="M390 205 L390 295 C390 315 380 330 370 340" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="390" cy="205" r="10" fill="#f59e0b" />

  <!-- Glowing AI Sparkle Center -->
  <g filter="url(#glow)">
    <path d="M256 360 Q256 400 235 410 Q256 420 256 460 Q256 420 277 410 Q256 400 256 360 Z" fill="url(#accentGrad)" />
    <path d="M360 110 Q360 130 350 135 Q360 140 360 160 Q360 140 370 135 Q360 130 360 110 Z" fill="#fbbf24" />
  </g>
</svg>